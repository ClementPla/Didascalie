<svg
  #wheel
  class="wheel"
  role="menu"
  tabindex="0"
  aria-label="Quick access tools"
  [attr.viewBox]="viewBox()"
  [style.width.px]="boxSize()"
  [style.height.px]="boxSize()"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  (keydown.space)="onClick()"
  (keydown.escape)="closeMenu.emit()"
>
  @for (segment of segments(); track $index; let i = $index) {
    <!-- Options for the aimed entry, drawn under it so the wedge's own edge
         stays crisp. -->
    @if (aimed() === i) {
      @for (child of segment.children; track $index; let j = $index) {
        @let childItem = items()[i].children![j];
        <g
          class="child"
          [class.child--aimed]="aimedChild() === j"
          [class.child--on]="
            childItem.type === segmentType.toggle && isChecked(childItem)
          "
        >
          <path class="child__wedge" [attr.d]="child.path" />
          <foreignObject
            [attr.x]="child.cx - 44"
            [attr.y]="child.cy - 18"
            width="88"
            height="36"
          >
            <div xmlns="http://www.w3.org/1999/xhtml" class="child__body">
              @if (childItem.materialIcon) {
                <span class="material-symbols-outlined child__icon">{{
                  childItem.materialIcon
                }}</span>
              } @else {
                <i [ngClass]="childItem.icon" class="child__icon"></i>
              }
              <span class="child__label">{{ childItem.label }}</span>
            </div>
          </foreignObject>
        </g>
      }
    }

    @let item = items()[i];
    <g class="slice" [class.slice--aimed]="aimed() === i">
      <path
        class="slice__wedge"
        [class.slice__wedge--current]="isActive(item)"
        [attr.d]="segment.path"
      />
      <foreignObject
        [attr.x]="segment.cx - 22"
        [attr.y]="segment.cy - 22"
        width="44"
        height="44"
      >
        <div xmlns="http://www.w3.org/1999/xhtml" class="slice__body">
          @if (item.materialIcon) {
            <span class="material-symbols-outlined slice__icon">{{
              item.materialIcon
            }}</span>
          } @else {
            <i [ngClass]="item.icon" class="slice__icon"></i>
          }
        </div>
      </foreignObject>
    </g>
  }

  <!-- Hub: dead zone, and where the aimed entry's name is printed. One place
       for the text instead of a label crammed into every wedge. -->
  <circle class="hub" [attr.r]="hubRadius" cx="0" cy="0" />
  <foreignObject
    [attr.x]="-hubRadius"
    [attr.y]="-hubRadius"
    [attr.width]="hubRadius * 2"
    [attr.height]="hubRadius * 2"
  >
    <div xmlns="http://www.w3.org/1999/xhtml" class="hub__body">
      <span class="hub__label">{{ aimedItem()?.label ?? '' }}</span>
    </div>
  </foreignObject>
</svg>
