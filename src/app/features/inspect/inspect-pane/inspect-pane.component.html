<div #host class="inspect-pane" [class.is-focused]="focused()">
  <canvas #canvas class="pane-canvas"></canvas>

  <header class="pane-header">
    <button
      type="button"
      class="pane-title"
      [title]="copied() ? 'Copied' : name() + ' — click to copy the name'"
      [attr.aria-label]="'Copy the name ' + name()"
      (click)="copyName()"
    >
      <span class="pane-title-text">{{ name() }}</span>
      <i class="pi" [class.pi-copy]="!copied()" [class.pi-check]="copied()"></i>
    </button>
    @if (frameCount() > 0) {
      <span class="pane-frame">{{ localIndex() + 1 }} / {{ frameCount() }}</span>
    }
    @if (waiting() || status() === 'loading') {
      <i class="pi pi-spin pi-spinner pane-spinner" aria-label="Loading"></i>
    }
    <span class="flex-1"></span>
    <p-button
      [icon]="reviewed() ? 'pi pi-check-circle' : 'pi pi-circle'"
      size="small"
      [rounded]="true"
      [text]="!reviewed()"
      [severity]="reviewed() ? 'success' : undefined"
      [pTooltip]="
        reviewed()
          ? 'Reviewed — click to unmark every frame (R)'
          : 'Mark every frame as reviewed (R)'
      "
      tooltipPosition="bottom"
      [ariaLabel]="
        reviewed()
          ? 'Mark ' + name() + ' as not reviewed'
          : 'Mark ' + name() + ' as reviewed'
      "
      [disabled]="status() !== 'ready' || reviewing()"
      (onClick)="toggleReviewed()"
    ></p-button>
    <p-button
      icon="pi pi-expand"
      size="small"
      [rounded]="true"
      [text]="true"
      pTooltip="Fit to pane (double-click)"
      tooltipPosition="bottom"
      ariaLabel="Fit to pane"
      (onClick)="fit(true)"
    ></p-button>
    <p-button
      icon="pi pi-pencil"
      size="small"
      [rounded]="true"
      [text]="true"
      pTooltip="Open this frame in the editor"
      tooltipPosition="bottom"
      [ariaLabel]="'Open ' + name() + ' in the editor'"
      [disabled]="status() !== 'ready'"
      (onClick)="editRequested.emit(localIndex())"
    ></p-button>
    @if (closable()) {
      <p-button
        icon="pi pi-times"
        size="small"
        [rounded]="true"
        [text]="true"
        pTooltip="Remove from the comparison"
        tooltipPosition="bottom"
        [ariaLabel]="'Remove ' + name() + ' from the comparison'"
        (onClick)="closeRequested.emit()"
      ></p-button>
    }
  </header>

  @if (status() === 'error') {
    <div class="pane-message">
      <i class="pi pi-exclamation-triangle"></i>
      <span>This sequence could not be loaded.</span>
    </div>
  }
</div>
