[package]
name = "didascalie"
version = "0.9.14"
description = "Didascalie — a fast, private, AI-assisted annotation studio for medical imaging"
authors = ["Clément Playout"]
repository = "https://github.com/ClementPla/Didascalie/tree/main"
edition = "2024"
rust-version = "1.85.2"

[lib]
name = "didascalie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Both backends are compiled in and `commands::ml::backend` picks at run time.
# Build with `--no-default-features` on a machine without the CUDA toolkit:
# burn's CUDA backend needs NVRTC at compile time.
default = ["gpu"]
gpu = ["burn/cuda", "dep:cudarc"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [ "rustls-tls"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-dialog = "2.7.1"
image = "0.25.10"
# DCT scale-on-decode of JPEG thumbnails. Already in the tree via `image`.
jpeg-decoder = "0.3"
regex = "1.12.3"
tauri-plugin-fs = "2"
base64 = "0.22.1"
tokio = { version = "1.52.3", features = ["rt", "macros", "time"] }
futures = "0.3.32"
ndimage = "0.1.1"
ndarray = {version = "0.16.1", features = ["rayon"] }
ndarray-image = "0.3.0"
imageproc = "0.26.2"
itertools = "0.14.0"
rayon = "1.12.0"
rmp-serde = "1.3.1"

lazy_static = "1.5.0"
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["v4"] }
parking_lot = "0.12.5"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter", "fmt" ] }
bitvec = "1.0.1"
skeletonize = "0.2.0"
svgtypes = "0.15.3"
usvg = "0.45.1"
roxmltree = "0.20.0"
hex_color = "3.0.0"
futures-util = "0.3.32"
sha2 = "0.11.0"
once_cell = "1.21.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream"] }
serde_bytes = "0.11.19"
# Available-RAM probe (`commands::ml::commands::patch_budget`).
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
ts-rs = "12.0.1"
tauri-plugin-opener = "2.5.5"
# DirectML exists only on Windows: with its `ort` feature enabled elsewhere,
# the build fails at link. It needs only DX12 and ships its own DLL.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.10", features = ["directml"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# The Python bridge. libzmq is built from C++ source, which does not
# cross-compile to Android as is.
zmq = "0.10.0"
# DirectML is in the Windows-only block above.
ort = { version = "=2.0.0-rc.10", features = ["cuda", "copy-dylibs"] }
# In-app training of the segmentation head (`commands::ml`). The loop is
# hand-rolled, without `burn-train`, to stream progress through Tauri events.
burn = { version = "0.21", default-features = false, features = ["std", "ndarray", "autodiff"] }
# Only so `commands::ml::backend` can report which CUDA this binary was built
# against. The features mirror cubecl-cuda's, so burn's cudarc is unchanged.
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "nccl", "fallback-dynamic-loading", "cuda-version-from-build-system", "fallback-latest"] }
# Desktop auto-update (GitHub releases). Registered under #[cfg(desktop)].
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# Dependencies only: this crate stays at `opt-level = 0` in dev, for fast
# rebuilds. Measure performance against a release build.
[profile.dev.package."*"]
opt-level = 3


[profile.release]
# Thin LTO: full LTO with one codegen unit cost minutes of link time. Use
# `--profile release-full` when the difference matters.
codegen-units = 16
lto = "thin"
opt-level = 2 # Prioritizes speed over binary size. Use `z` if you prefer smaller binary or `s` for in between.
# No `panic = "abort"`: `commands::ml::backend` detects CUDA by catching a
# panic, and raises a `compile_error!` if this is set.
strip = true # Ensures debug symbols are removed.
incremental = true

[profile.release-full]
inherits = "release"
codegen-units = 1
lto = true


[patch.crates-io]
