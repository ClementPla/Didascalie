name: "publish"

on:
  push:
    branches:
      - release
    # A push that changes only these files does not rebuild the app. Read the
    # Docs and draft-pdf.yml build the docs and the paper on their own.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "paper.bib"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - ".github/scripts/**"
  # "Run workflow" button in the Actions tab, to build anyway.
  workflow_dispatch:

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

# The microscopy reader shipped with the app: a release of
# https://github.com/ClementPla/didascalie-bioformats (a separate GPL program,
# see THIRD_PARTY_NOTICES.md). Bump it together with the app when the reader's
# JSON protocol changes (`microscopy::PROTOCOL` in src-tauri).
env:
  READER_VERSION: v0.1.0

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - platform: "windows-latest"
            args: ""
            target: x86_64-pc-windows-msvc
          - platform: "ubuntu-22.04" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt install -y --reinstall ca-certificates
          sudo update-ca-certificates -f
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.

      # Into src-tauri/binaries/, which src-tauri/tauri.microscopy.conf.json (merged
      # below with --config) bundles next to the application. That overlay is kept
      # out of tauri.conf.json so local and Android builds do not need the binary.
      - name: fetch the microscopy reader
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src-tauri/binaries
          gh release download "$READER_VERSION" --repo ClementPla/didascalie-bioformats             --pattern "didascalie-bioformats-${{ matrix.target }}*" --dir src-tauri/binaries
          gh release download "$READER_VERSION" --repo ClementPla/didascalie-bioformats             --pattern LICENSE --output src-tauri/binaries/didascalie-bioformats-LICENSE.txt
          chmod +x src-tauri/binaries/didascalie-bioformats-* || true
          ls -l src-tauri/binaries

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Which CUDA the head's GPU backend is built against.
          #
          # cudarc derives the NVRTC DLL names it loads at *run* time from a
          # version baked in at *build* time, normally by running `nvcc
          # --version`. These runners have no CUDA toolkit, and cubecl-cuda
          # enables cudarc's `fallback-latest`, so without this the build
          # silently targets the newest CUDA cudarc knows (13.3) and then looks
          # for `nvrtc64_130_0.dll` — a name no CUDA 12 toolkit ships. The
          # result is not a build failure but a silent CPU fallback on every
          # user's machine, which reads as "training is slow".
          #
          # 12.6 is not this machine's toolkit specifically: every CUDA 12.x
          # release ships `nvrtc64_120_0.dll`, and that is the name cudarc
          # derives from any 12.x value here. Bump only when CUDA 13 toolkits
          # are the common case, since it trades one generation for the other.
          CUDARC_CUDA_VERSION: "12060"
          # Auto-update signing. Generate a keypair once with
          #   npm run tauri signer generate -- -w ~/.tauri/didascalie.key
          # then add these as repository secrets (Settings → Secrets → Actions)
          # and paste the PUBLIC key into src-tauri/tauri.conf.json (plugins.updater.pubkey).
          # With these set, tauri-action signs the installers and publishes a
          # `latest.json` update manifest to the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: didascalie-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Didascalie v__VERSION__"
          # Publish directly (not as a draft) so GitHub's /releases/latest — which
          # the updater's endpoint resolves — points at the new version and clients
          # auto-update. A draft is invisible to /releases/latest.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.microscopy.conf.json

  # Signed APK for Android tablets, attached to the release the desktop job
  # made. Runs after it so the release exists. Needs four repository secrets:
  #   ANDROID_KEYSTORE_BASE64    the keystore file: base64 -w0 didascalie.jks
  #   ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD
  # Without them the job only logs a warning. Always sign with the same key:
  # Android refuses an update signed with another one.
  publish-android:
    needs: publish-tauri
    # Still attach the APK when one desktop build failed.
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.0.12916984
    steps:
      - name: check for the signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is not built."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - name: setup node
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup java
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup the Android SDK and NDK
        if: steps.key.outputs.present == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.1 ndk;${{ env.NDK_VERSION }}"

      - name: install Rust stable
        if: steps.key.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: cache cargo
        if: steps.key.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: install frontend dependencies
        if: steps.key.outputs.present == 'true'
        run: npm install

      - name: write the signing key
        if: steps.key.outputs.present == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/didascalie.jks"
          {
            echo "storeFile=$RUNNER_TEMP/didascalie.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: build the APK
        if: steps.key.outputs.present == 'true'
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --target aarch64

      - name: attach the APK to the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="didascalie-v$VERSION"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed APK found."; exit 1
          fi
          cp "$APK" "Didascalie_${VERSION}_android_arm64.apk"
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "Didascalie v$VERSION" \
              --notes ""
          gh release upload "$TAG" "Didascalie_${VERSION}_android_arm64.apk" --clobber

  # A download table, grouped by platform, at the top of the release notes:
  # GitHub lists the assets alphabetically, with the updater files mixed in.
  release-notes:
    needs: [publish-tauri, publish-android]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: write the download table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          python3 .github/scripts/release_downloads.py "didascalie-v$VERSION"
