name: CI

# Quality gates: compile the frontend, run unit tests, and build/test the
# Rust backend. Runs on every PR and on pushes to the main branches.
on:
  pull_request:
  push:
    branches:
      - main
      - release

jobs:
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (type + template check)
        run: npx ng build --configuration development

      # Hard gate on error-level rules; the adoption backlog is `warn` (see
      # eslint.config.js) and doesn't fail the build.
      - name: Lint
        run: npx ng lint

      # A hard gate since 1e70d2b. It was informational while the only specs
      # were CLI-generated stubs — which meant two of them failed from the day
      # they were generated and CI stayed green, so nobody noticed for the life
      # of the project. Do not restore continue-on-error.
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib

      # A hard gate. This does not pass -D warnings, so the ~68 existing
      # style warnings stay advisory; what it catches is clippy's deny-level
      # lints, which are correctness bugs. One had been sitting in
      # ml/scribble.rs unnoticed precisely because this step could not fail.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
        continue-on-error: true
